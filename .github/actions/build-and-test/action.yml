name: Build and test
description: >
  Install, build, and run the full Playwright e2e suite. Shared by ci.yml (pull
  requests) and deploy.yml (push to main, weekly rebuild, manual run) so the PR
  check and the deploy gate can never drift apart. The repo has no typecheck or
  lint script; add those steps here when it gets one.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - run: npm ci
      shell: bash

    - run: npm run build
      shell: bash

    - name: Install Playwright browser
      run: npx playwright install --with-deps chromium
      shell: bash

    - name: Run e2e smoke tests
      run: npm run test:e2e
      shell: bash

    - name: Upload Playwright report
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 7
        if-no-files-found: ignore
