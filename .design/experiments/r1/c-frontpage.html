<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C · Front page — Unify Events</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  /* C: the team's picks are the hero. Headline left, featured stack right;
     stats drop to a strip under the hero; partner events as a dense 3-col grid. */
  .hero::before { background: linear-gradient(100deg, rgba(23,22,22,.9) 0%, rgba(23,22,22,.72) 45%, rgba(23,22,22,.55) 100%); }
  .hero .wrap { padding-top: 8.5rem; padding-bottom: clamp(2.5rem, 5vw, 4rem); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 480px); gap: clamp(2rem, 5vw, 4.5rem); align-items: center; }
  .hero .copy { display: grid; gap: 1.25rem; align-content: center; }
  .hero .h1 { font-size: clamp(2.5rem, 5.4vw, 4.8rem); max-width: 12ch; }
  .picks { display: grid; gap: .75rem; }
  .picks-h { display: flex; justify-content: space-between; align-items: baseline; color: #fff; }
  .picks-h b { font-size: 1rem; letter-spacing: -.02em; }
  .picks-h span { font-family: var(--ui); font-size: .78rem; color: rgba(255,255,255,.6); }
  .card--lead { border: 0; box-shadow: 0 30px 60px -28px rgba(0,0,0,.7); }
  .card--lead .title { font-size: 1.3rem; letter-spacing: -.03em; }
  .mini { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
  .mini a { display: grid; grid-template-columns: 56px 1fr; gap: .65rem; align-items: center; padding: .6rem; border-radius: 12px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.14); color: #fff; transition: background .2s; }
  .mini a:hover { background: rgba(255,255,255,.16); }
  .mini img { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; }
  .mini b { font-size: .84rem; font-weight: 600; line-height: 1.25; letter-spacing: -.01em; }
  .mini small { display: block; font-family: var(--ui); font-size: .72rem; color: #ffb39f; margin-top: .2rem; }
  .strip { background: var(--ink); color: #fff; border-top: 1px solid rgba(255,255,255,.1); }
  .strip .wrap { padding-top: 1.5rem; padding-bottom: 1.5rem; }
  @media (max-width: 980px) { .hero .wrap { grid-template-columns: 1fr; } .picks { max-width: 560px; } }
  @media (max-width: 520px) { .mini { grid-template-columns: 1fr; } }

  .list { padding: clamp(3rem, 6vw, 4.5rem) 0 6rem; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 2.5rem; align-items: start; margin-top: 2rem; }
  .aside { position: sticky; top: 104px; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin: 1.75rem 0 1.25rem; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 1rem; }
  .grid3 .title { font-size: 1rem; }
  .grid3 .body { padding: .85rem .95rem 1rem; }
  .more { display: block; margin: 2rem auto 0; font: 600 .95rem var(--ui); padding: .8rem 1.4rem; border-radius: 12px; border: 1px solid var(--ink); background: #fff; cursor: pointer; }
  @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } .aside { position: static; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; } .aside .widget + .widget { margin-top: 0; } }
  @media (max-width: 700px) { .aside { grid-template-columns: 1fr; } }
</style></head>
<body>
<script src="events.js"></script><script src="shared.js"></script>
<div id="nav"></div>
<header class="hero"><img src="assets/hero.avif" alt="">
  <div class="wrap"><div class="copy" id="hero"></div>
    <div class="picks"><div class="picks-h"><b><span style="color:#ff8a6b">★</span> Picked by the Unify team</b><span>Open to everyone</span></div>
      <div id="lead"></div><div class="mini" id="mini"></div></div>
  </div>
</header>
<div class="strip"><div class="wrap" id="stats"></div></div>
<main class="list"><div class="wrap">
  <p class="eyebrow">Partnered events</p>
  <h2 class="sec-h" style="margin-top:.5rem">Events with our community partners</h2>
  <p class="sec-p">Hosted with our community partners. Filter by category or partner to find what you're looking for.</p>
  <div class="layout">
    <div>
      <div id="chips" style="display:grid;gap:1rem"></div>
      <div class="toolbar"><span class="count" id="count"></span><button class="clear" id="clear" hidden>Clear filters</button></div>
      <div class="grid3" id="grid"></div>
      <button class="more" id="more">Show more events</button>
    </div>
    <aside class="aside"><div class="widget" id="cal"></div><div class="widget" id="partners"></div></aside>
  </div>
</div></main>
<script>
  document.getElementById("nav").innerHTML = navHTML();
  document.getElementById("hero").innerHTML = heroInner();
  document.getElementById("stats").innerHTML = statsHTML();
  const [lead, ...rest] = D.featured;
  document.getElementById("lead").innerHTML = card(lead, { featured: true }).replace('class="card card--feat"', 'class="card card--feat card--lead"');
  document.getElementById("mini").innerHTML = rest.map((e) => `<a href="#event-${e.id}"><img src="${esc(e.cover || PLACEHOLDER)}" alt=""><span><b class="clamp2">${esc(e.title)}</b><small>${e.weekday}, ${e.month} ${e.day} · ${e.time.split(" – ")[0]}</small></span></a>`).join("");
  renderChips(document.getElementById("chips"));
  renderCalendar(document.getElementById("cal"));
  renderPartners(document.getElementById("partners"));
  let limit = 12;
  function drawList() {
    const list = filtered();
    document.getElementById("count").textContent = `${list.length} upcoming event${list.length === 1 ? "" : "s"}`;
    document.getElementById("clear").hidden = !(state.genre || state.partner || state.day);
    document.getElementById("grid").innerHTML = list.length ? list.slice(0, limit).map((e) => card(e)).join("") : `<div class="empty">No events match these filters.</div>`;
    document.getElementById("more").hidden = list.length <= limit;
  }
  document.getElementById("more").onclick = () => { limit += 12; drawList(); };
  document.getElementById("clear").onclick = clearAll;
  onChange(() => { limit = 12; drawList(); });
  drawList();
</script>
</body></html>
